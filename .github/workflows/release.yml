name: publish release version

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - name: Check release version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: pnpm install --frozen-lockfile
      - run: python3 -B src/scripts/test_firefox_update.py
      - run: pnpm build+zip
      - run: python3 src/scripts/package-firefox-amo.py
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build
          include-hidden-files: true
  deploy-web:
    needs: [build, sign-firefox]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: firefox-update
          path: build/web
      - name: Reject an older update feed
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch origin gh-pages
            if git cat-file -e FETCH_HEAD:firefox-updates.json 2>/dev/null; then
              git show FETCH_HEAD:firefox-updates.json > "$RUNNER_TEMP/previous-firefox-updates.json"
              python3 src/scripts/firefox-update.py check-feed build/web/firefox-updates.json "$RUNNER_TEMP/previous-firefox-updates.json"
            fi
          else
            status=$?
            test "$status" -eq 2
          fi
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
  sign-firefox:
    needs: [build, create-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build
      - name: Sign unlisted Firefox extension with matching source
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        shell: bash
        run: |
          test -n "$WEB_EXT_API_KEY" || { echo 'Missing AMO_JWT_ISSUER'; exit 1; }
          test -n "$WEB_EXT_API_SECRET" || { echo 'Missing AMO_JWT_SECRET'; exit 1; }
          version=$(node -p 'require("./package.json").version')
          pnpm dlx web-ext@10.7.0 sign --no-config-discovery --channel=unlisted \
            --source-dir=build/firefox --artifacts-dir=build/signed \
            --upload-source-code="build/amo/kiss-translator-${version}-source.zip" \
            --approval-timeout=3600000
      - name: Validate signed payload and generate update feed
        run: python3 src/scripts/firefox-update.py prepare
      - name: Upload signed XPI before publishing the update feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" build/firefox-release/*.xpi --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-update
          path: build/firefox-release/firefox-updates.json
          if-no-files-found: error
  create-release:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      upload_url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract Release Notes
        id: extract_notes
        shell: bash
        run: |
          LOG_FILE="CHANGELOG.md"
          
          if [ -f "$LOG_FILE" ]; then
            # 使用 awk 提取：从第一个 "## " 后面开始，直到遇到下一个 "## " 停止
            # 这里的逻辑假设最新日志在文件最上方
            NOTES=$(awk '/^## / {if (p) exit; p=1; next} p' "$LOG_FILE")
          else
            NOTES="Release ${{ github.ref }}"
          fi
          
          # 处理多行文本并写入 GITHUB_OUTPUT
          {
            echo "body<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/create-release@v1
        id: create-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: ${{ steps.extract_notes.outputs.body }}
          draft: false
          prerelease: false
  upload-release:
    needs: [build, create-release]
    strategy:
      matrix:
        client: ["chrome", "edge", "firefox", "userscript", "thunderbird"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build
      - uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./build/${{ matrix.client }}.zip
          asset_name: kiss-translator_${{ github.ref_name }}_${{ matrix.client }}.zip
          asset_content_type: application/zip
